<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Ward Patient Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column built for a phone held in one hand; list -> patient record -> one-page summary */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e8ecf2; --line:#d3d9e3;
  --fg:#16202e; --muted:#5a6678; --accent:#1f4fb8; --accent-ink:#ffffff; --accent-soft:#e3eafa;
  --amber:#a35a00; --amber-soft:#fdf0dc; --green:#1c7a46; --green-soft:#e0f3e8;
  --blue:#2357a6; --blue-soft:#e2ecf9; --grey:#566070; --grey-soft:#eceff3;
  --red:#b3261e; --red-soft:#fbe5e3; --label:#fffdf6; --label-line:#cfc7ad;
  /* system fonts only: the app makes no requests to font servers */
  --f-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,"Roboto Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171e29; --sunk:#1f2836; --line:#2c3748;
  --fg:#e7ecf3; --muted:#9aa6b8; --accent:#7fa3ff; --accent-ink:#0b1220; --accent-soft:#1c2a4a;
  --amber:#f2b25c; --amber-soft:#3a2a12; --green:#6fd09a; --green-soft:#16301f;
  --blue:#8db7f5; --blue-soft:#172a44; --grey:#a7b1c0; --grey-soft:#232c39;
  --red:#ff8a80; --red-soft:#3b1a18; --label:#232a22; --label-line:#4a5040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --sunk:#1f2836; --line:#2c3748;
  --fg:#e7ecf3; --muted:#9aa6b8; --accent:#7fa3ff; --accent-ink:#0b1220; --accent-soft:#1c2a4a;
  --amber:#f2b25c; --amber-soft:#3a2a12; --green:#6fd09a; --green-soft:#16301f;
  --blue:#8db7f5; --blue-soft:#172a44; --grey:#a7b1c0; --grey-soft:#232c39;
  --red:#ff8a80; --red-soft:#3b1a18; --label:#232a22; --label-line:#4a5040; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,.btn{font:inherit;font-weight:700;font-size:15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;text-decoration:none}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--red)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:progress}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-top:16px}
.notice b{font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
label.f span{letter-spacing:.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* list */
.search{margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;background:var(--surface);cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ghead{display:flex;align-items:baseline;gap:8px;margin:22px 0 0;font-family:var(--f-display);font-size:18px;font-weight:700}
.ghead small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.ho{margin-top:14px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ho textarea{min-height:170px;font-size:15px;line-height:1.5}
.pastbtn{width:100%;margin-top:28px;border-radius:var(--r);justify-content:flex-start;padding:14px 16px;min-height:54px;font-size:17px;text-align:left}
.plist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.pcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-family:var(--f-display);font-weight:700;font-size:19px;min-width:0;overflow-wrap:anywhere}
.pcard .meta{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pcard .dx{grid-column:1/-1;font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r);margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:start}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.d-awaiting{color:var(--amber);background:var(--amber-soft)}
.d-discharged{color:var(--green);background:var(--green-soft)}
.d-transferred{color:var(--blue);background:var(--blue-soft)}
.d-inpatient,.d-none{color:var(--grey);background:var(--grey-soft)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
/* record */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.status{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:20px}
.status.err{color:var(--red)}
.status.ok{color:var(--green)}
.unsure{box-shadow:0 0 0 2px #f59e0b;border-color:#f59e0b!important}
.status.warn{color:#b45309}
.bar-p{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;flex:1;max-width:160px}
.bar-p i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.sticker{background:var(--label);border:1px solid var(--label-line);border-radius:6px;padding:10px 12px;font-family:var(--f-mono);font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;min-height:32px;padding:4px 10px;font-size:13px;background:var(--surface)}
.thumb input{position:absolute;left:0;right:0;bottom:0;border-radius:0;border:0;border-top:1px solid var(--line);font-size:13px;padding:6px 8px;background:var(--surface)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dbtn{border-radius:10px;min-height:48px;font-size:15px}
.dbtn[aria-pressed="false"]{background:var(--surface);color:var(--fg);border-color:var(--line)}
.dbtn[aria-pressed="true"].d-awaiting{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.dbtn[aria-pressed="true"].d-discharged{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.dbtn[aria-pressed="true"].d-transferred{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.dbtn[aria-pressed="true"].d-inpatient{border-color:var(--grey);background:var(--grey-soft)}
.grid32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
@media (max-width:440px){.grid32{grid-template-columns:minmax(0,1fr)}}
input[type="date"]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:44px}
.seg label{position:relative;border:1px solid var(--line);border-radius:8px;padding:12px 10px;text-align:center;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface)}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked).d-awaiting{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.seg label:has(input:checked).d-discharged{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.seg label:has(input:checked).d-transferred{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.seg label:has(input:checked).d-inpatient{border-color:var(--grey);background:var(--grey-soft);color:var(--fg)}
.seg label:not(:has(input:checked)){background:var(--surface);color:var(--fg)}
.seg label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.ct{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ct-found{font-size:13px;font-weight:700;color:var(--green)}
details summary{cursor:pointer;font-size:14px;color:var(--muted);font-weight:700}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:18px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.saved{font-size:13px;color:var(--muted);margin-right:auto;align-self:center}
/* summary sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.sheet-h{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.sheet-h h1{font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.ids{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.ids div{display:flex;gap:6px;align-items:baseline}
.ids dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ids dd{margin:0}
.sheet-b{display:flex;flex-direction:column}
.blk{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:130px 1fr;gap:12px}
.blk:last-child{border-bottom:0}
@media (max-width:520px){.blk{grid-template-columns:1fr;gap:4px}}
.blk h2{padding-top:2px}
.blk .v{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.blk .v.none{color:var(--muted);font-style:italic}
.ctq{border-left:3px solid var(--accent);padding-left:12px;margin:0 0 10px}
.ctq:last-child{margin-bottom:0}
.ctq .src{font-size:12px;color:var(--muted);margin-bottom:2px}
.sheet .thumbs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
figure{margin:0}
figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.foot{font-size:12px;color:var(--muted);padding:10px 18px;background:var(--sunk)}
.meds{display:flex;flex-direction:column;gap:6px}
.medrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 4px;background:var(--surface)}
.medrow.on{border-color:var(--accent);background:var(--accent-soft)}
.medname{flex:1;min-width:0;border:0;background:transparent;justify-content:flex-start;text-align:left;font-size:15px;padding:8px 10px;min-height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.medcat{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.medmain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.medmain .medname{flex:none;width:100%}
.medday{min-height:28px;padding:2px 10px;margin:0 0 4px 6px;font-size:12px;font-weight:700;border:0;background:transparent;color:var(--accent);border-radius:999px}
.medday:hover{background:var(--surface)}
.meddayin{width:80px;min-height:32px;padding:4px 8px;margin:0 0 4px 8px;font-size:14px}
.medrow:not(.on) .medname{font-weight:400}
.freqs{display:flex;gap:4px;flex:none}
.freq{min-height:34px;min-width:40px;padding:4px 8px;font-size:13px;border-radius:999px}
.freq[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.med{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.med[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.med .x{font-weight:700;color:var(--red);margin-left:2px}
.medlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.medlist li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;font-size:15px}
.medlist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.medlist li button{min-height:32px;padding:4px 10px;font-size:13px}
.thumb.tap{cursor:zoom-in}
.thumb.tap img{object-position:top}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.viewer .vb{display:flex;justify-content:flex-end}
.viewer .vi{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;align-items:center}
.viewer img{max-width:100%;height:auto}
.bkmodal{position:fixed;inset:0;z-index:25;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bkcard{background:var(--surface);color:var(--fg);border-radius:16px;padding:18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.olist{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.olist>li{border-bottom:1px solid var(--line)}
.olist>li:last-child{border-bottom:0}
.orow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;min-height:58px;border:0;border-radius:0;background:transparent;text-align:left;font-weight:700;justify-content:flex-start;position:relative}
.orow .grow{display:flex;flex-direction:column;gap:2px}
.orow .grow small{font-weight:400;color:var(--muted);font-size:13px}
.opanel{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      line += it.str; if (it.hasEOL) { all += line.trimEnd() + "\n"; line = ""; lastY = null; continue; }

const HEADINGS = [

  ["summary", /\b(summary)\b/i], ["interpretation", /\b(interpretation)\b/i]

/* ---------- backups: a file the user keeps in a folder of their choice ---------- */
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function backupState() {
  const last = lsGet("wpl-last-backup");
  const real = patients.filter(p => !p.example);
  const changed = real.filter(p => !last || (p.updated || "") > last).length + (+lsGet("wpl-deleted-since") || 0);
  return { last, changed, real: real.length };
}
/* Backup encryption: AES-256-GCM with a key derived from the backup password (PBKDF2-SHA256, 310,000 rounds).
   Done with the phone's built-in Web Crypto; the password never leaves the phone. */
const b64 = buf => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptBackup(plain, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await deriveKey(password, salt, iter), new TextEncoder().encode(plain));
  return JSON.stringify({ app: "ward-patient-log", encrypted: "AES-256-GCM/PBKDF2-SHA256", iter, salt: b64(salt), iv: b64(iv), data: b64(ct) });
}
async function decryptBackup(j, password) {
  try {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(j.iv) }, await deriveKey(password, unb64(j.salt), j.iter), unb64(j.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error("wrong password"); }
}
const backupPassword = () => lsGet("wpl-backup-pw") || "";
function askPassword(title, text) {
  return new Promise(resolve => {
    const m = document.createElement("div"); m.className = "bkmodal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", title);
    m.innerHTML = `<form class="bkcard"><h2 style="color:var(--fg);font-size:18px;letter-spacing:0;text-transform:none">${esc(title)}</h2>
      ${text ? `<p class="hint">${esc(text)}</p>` : ""}<input type="password" id="pw-in" autocomplete="current-password" aria-label="Password">
      <div class="row"><button class="primary" type="submit">OK</button><button class="ghost" type="button" id="pw-x">Cancel</button></div></form>`;
    document.body.appendChild(m);
    const close = v => { m.remove(); resolve(v); };
    m.querySelector("form").onsubmit = e => { e.preventDefault(); close(m.querySelector("#pw-in").value); };
    m.querySelector("#pw-x").onclick = () => close(null);
    m.querySelector("#pw-in").focus();
  });
}
async function exportBackup() {
  const stamp = new Date();
  let data = JSON.stringify({ app: "ward-patient-log", version: 1, exported: stamp.toISOString(), medButtons: medButtons(), patients: patients.filter(p => !p.example) });
  if (backupPassword()) data = await encryptBackup(data, backupPassword());
  const filename = `patient-log-backup-${stamp.toISOString().slice(0,16).replace("T", "_").replace(":", "")}.json`;
  const done = () => { lsSet("wpl-last-backup", stamp.toISOString()); lsSet("wpl-deleted-since", "0"); toast("Backup saved"); if (!location.hash || location.hash === "#options") route(); };
  // 1. iPhone / Android share sheet: "Save to Files" lets you pick the folder
  try {
    const file = new File([data], filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Patient Log backup" }); done(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") { toast("Backup not saved"); return; } }
  // 2. inside claude.ai
  const dl = await (window.claude?.use?.("downloads") ?? null);
  if (dl) {
    try { await dl.save({ filename, data: new Blob([data], {type: "application/json"}) }); done(); return; }
    catch (e) { if (e?.code === "declined") { toast("Backup not saved"); return; } }
  }
  // 3. plain browser download
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); done(); }
  catch { toast("This browser cannot save files"); }
}
async function importBackup(e) {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    let j = JSON.parse(await f.text());
    if (j && j.encrypted) {
      let pw = backupPassword(), out = null;
      if (pw) { try { out = await decryptBackup(j, pw); } catch {} }
      while (!out) {
        pw = await askPassword("Backup password", "This backup is encrypted. Enter the password it was saved with.");
        if (pw === null) return;
        try { out = await decryptBackup(j, pw); } catch { toast("Wrong password, try again"); }
      }
      j = out;
    }
    if (!Array.isArray(j.patients)) throw new Error("this isn't a Patient Log backup file");
    if (Array.isArray(j.medButtons)) saveMedButtons(j.medButtons);
    let added = 0, updated = 0, kept = 0;
    for (const b of j.patients) {
      if (!b || !b.id) continue;
      const cur = patients.find(x => x.id === b.id);
      if (!cur) { await store.put(b); added++; }
      else if ((b.updated || "") > (cur.updated || "")) { await store.put(b); updated++; }
      else kept++;
    }
    patients = await store.all();
    toast(`Restored from ${fmtDate(j.exported)}: ${added} added, ${updated} updated${kept ? ", " + kept + " already up to date" : ""}`);
    route();
  } catch (err) { toast("Could not restore: " + err.message); }
}

      await save(p); drawLabs(); markSaved();
      st.className = found.count ? "status ok" : "status err";
      st.textContent = `Added ${pages.length} page${pages.length === 1 ? "" : "s"}. ` + (found.count ? `Picked out ${found.count} result${found.count === 1 ? "" : "s"}; check them against the report.` : "No key values were recognised; type them in from the report.");
    } catch (err) { console.error(err); st.className = "status err"; st.textContent = "Couldn't open that file (" + (err.message || err) + ")."; }
  };

  // photos
  const drawPh = () => {
    $("#phlist").innerHTML = p.photos.map((ph, i) => `<div class="thumb"><img src="${ph.src}" alt="${esc(ph.caption || "Clinical photo " + (i+1))}">

    $("#phlist").querySelectorAll("button").forEach(b => b.onclick = () => { p.photos.splice(+b.dataset.i, 1); autosave(); drawPh(); });

  };
  drawPh();
  $("#phf").onchange = async e => {
    const files = [...e.target.files]; e.target.value = "";
    for (const f of files) { if (p.photos.length >= 6) { toast("Six photos is the limit for one patient"); break; }
      try { p.photos.push({ src: await compressPhoto(f), caption: "", taken: new Date().toISOString() }); } catch { toast("Couldn't open " + f.name); } }
    await save(p); drawPh(); markSaved();
  };
}

/* ---------- medicine buttons (shared by all patients, kept on this device) ---------- */
const MED_DEFAULTS = ["Paracetamol 1g PO", "Ibuprofen 400mg PO", "Tramadol 50mg PO", "Morphine 5mg IV",
  "Ceftriaxone 1g IV", "Metronidazole 500mg IV", "Enoxaparin 40mg SC", "Omeprazole 40mg IV"];
const OLD_DEFAULTS = ["Paracetamol 1g PO 6-hourly", "Ibuprofen 400mg PO 8-hourly", "Tramadol 50mg PO 6-hourly PRN", "Morphine 5mg IV 4-hourly PRN",
  "Ceftriaxone 1g IV daily", "Metronidazole 500mg IV 8-hourly", "Enoxaparin 40mg SC daily", "Omeprazole 40mg IV daily"];
const FREQS = ["dly", "bd", "tds", "qid"];
// Medicine buttons: {name, cat: "essential" | "supportive"}. Only essential medicines go into handovers.
const SUPPORTIVE_RE = /paracetamol|ibuprofen|diclofenac|tramadol|morphine|codeine|omeprazole|pantoprazole|metoclopramide|ondansetron|lactulose|senna|laxative|vitamin|multivit|thiamine|tears|lubricant/i;
const defaultCat = name => SUPPORTIVE_RE.test(name) ? "supportive" : "essential";
function normButtons(v) {
  return v.map(m => {
    if (typeof m === "string") { const i = OLD_DEFAULTS.indexOf(m); const name = i >= 0 ? MED_DEFAULTS[i] : m; return { name, cat: defaultCat(name) }; }
    return { name: m.name, cat: m.cat === "supportive" ? "supportive" : "essential" };
  });
}
function medButtons() {
  try { const v = JSON.parse(localStorage.getItem("wpl-meds")); if (Array.isArray(v)) return normButtons(v); } catch {}
  return medButtons._mem || normButtons(MED_DEFAULTS);
}
const medCat = name => (medButtons().find(b => b.name === name) || {}).cat || defaultCat(name);
// A patient's medicine: {name, freq: "dly"|"bd"|"tds"|"qid"|"", start: "YYYY-MM-DD"}
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function patientMeds(p) {
  p.meds = (p.meds || []).map(m => typeof m === "string" ? { name: m, freq: "", start: (p.updated || todayISO()).slice(0, 10) } : m);
  return p.meds;
}
function medDay(m) {
  const [y, mo, d] = (m.start || todayISO()).split("-").map(Number), start = new Date(y, mo - 1, d), now = new Date();
  return Math.max(1, Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - start) / 864e5) + 1);
}
const medText = m => `${m.name}${m.freq ? " " + m.freq : ""}, Day ${medDay(m)}`;
function saveMedButtons(list) { list = normButtons(list); medButtons._mem = list; try { localStorage.setItem("wpl-meds", JSON.stringify(list)); } catch {} }

async function pdfPages(file, max) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = abs("lib/pdf.worker.min.js");
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise, out = [];
  for (let n = 1; n <= Math.min(pdf.numPages, max); n++) {
    const page = await pdf.getPage(n), vp0 = page.getViewport({scale: 1}), vp = page.getViewport({scale: 1600 / vp0.width});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: g, viewport: vp}).promise; out.push(c.toDataURL("image/jpeg", 0.85));
  }
  return out;
}
function openViewer(pages, start = 0) {
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Full size view");
  v.innerHTML = `<div class="vb"><button id="vclose">Close</button></div><div class="vi">${pages.map((src, i) => `<img src="${src}" alt="Page ${i+1}" data-i="${i}">`).join("")}</div>`;
  document.body.appendChild(v); document.body.style.overflow = "hidden";
  const close = () => { v.remove(); document.body.style.overflow = ""; removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") close(); };
  addEventListener("keydown", esc_); v.querySelector("#vclose").onclick = close; v.querySelector("#vclose").focus();
  const img = v.querySelector(`img[data-i="${start}"]`); if (img) setTimeout(() => img.scrollIntoView(), 50);
}

/* ---------- lab values (read on the device) ---------- */
const LAB_TESTS = [
  ["Hb", /\b(?:Hb|HGB|Ha?emoglobin)\b/i, /(\d{1,2}(?:[.,]\d{1,2})?)/, 2, 25],
  ["WCC", /\b(?:WCC|WBC|White\s*(?:cell|blood\s*cell)s?(?:\s*count)?|Leu[ck]ocytes?)\b/i, /(\d{1,3}(?:[.,]\d{1,2})?)/, 0.1, 300],
  ["Plt", /\b(?:Plt|PLT|Platelets?(?:\s*count)?|Thrombocytes?)\b/i, /(\d{1,4})/, 1, 2500],
  ["Urea", /\b(?:Urea|BUN)\b/i, /(\d{1,3}(?:[.,]\d{1,2})?)/, 0.5, 60],
  ["Creat", /\b(?:Creat(?:inine)?)\b/i, /(\d{1,4})/, 10, 3000],
  ["Na", /(?:\bSodium\b|\bNa\b\+?)/i, /(\d{3})/, 90, 200],
  ["K", /(?:\bPotassium\b|\bK\b\+?)/, /(\d(?:[.,]\d{1,2})?)/, 1, 10]
];
function extractLabValues(raw) {
  const lines = raw.replace(/\r/g, "").split("\n").map(l => l.replace(/[ \t]+/g, " ").trim());
  const got = [];
  for (const [name, re, numRe, lo, hi] of LAB_TESTS) {
    for (const l of lines) {
      const m = l.match(re); if (!m) continue;
      const after = l.slice(m.index + m[0].length).replace(/^[^\d]{0,30}?(?=\d)/, "");
      if (/^(?:\d+\s*[-–]\s*\d)/.test(after) && !/\d\s+\d/.test(after)) continue; // only a reference range on this line
      const n = after.match(new RegExp("^" + numRe.source));
      if (!n) continue;
      const v = parseFloat(n[1].replace(",", "."));
      if (v < lo || v > hi) continue;
      const flag = /^\S+\s*\b([HL])\b/.exec(after) || /^\S+\s*(\*|↑|↓)/.exec(after);
      got.push(`${name} ${n[1].replace(",", ".")}${flag ? (flag[1] === "H" || flag[1] === "↑" ? " (H)" : flag[1] === "L" || flag[1] === "↓" ? " (L)" : " (*)") : ""}`);
      break;
    }
  }
  // microbiology: culture, Gram stain, organism and sensitivities
  const micro = []; let take = 0;
  for (const l of lines) {
    if (/\b(cultures?|gram\s*stain|gram[-\s]?(positive|negative)|organisms?|isolated|no\s+growth|sensitivit|susceptib|MC\s*&\s*S|resistant)\b/i.test(l)) take = 6;
    if (/^(authori[sz]ed|reported|verified|signed|page\s+\d|printed|end of report)/i.test(l)) { take = 0; continue; }
    if (take > 0 && l) { micro.push(l); take--; } else if (!l) take = Math.min(take, 1);
    if (micro.join(" ").length > 500) break;
  }
  const notes = [got.join(", "), micro.length ? "Micro: " + micro.join("; ") : ""].filter(Boolean).join("\n");
  const title = [got.some(g => /^(Hb|WCC|Plt)/.test(g)) ? "FBC" : "", got.some(g => /^(Urea|Creat|Na|K) /.test(g)) ? "U&E" : "", micro.length ? "Micro" : ""].filter(Boolean).join(", ");
  return { notes, title, count: got.length + (micro.length ? 1 : 0) };
}

  panel.innerHTML = `<div class="sec-h"><h2>Ward round list</h2><button class="ghost" id="wrall">Select none</button></div>
    <p class="hint">Tick the patients to include.</p>

      <span class="grow">${esc(p.name || "Unnamed")} <span class="hint" style="display:inline">${esc([p.ward, wardGroup(p) === "in" ? "Inpatient" : wardGroup(p) === "out" ? "Outlier" : ""].filter(Boolean).join(" · "))}</span></span></label>`).join("") || `<span class="hint">No active patients.</span>`}</div>

  };
  $("#wrcopy").onclick = () => navigator.clipboard.writeText($("#wrtext").value).then(() => toast("Ward round list copied"), () => { $("#wrtext").focus(); $("#wrtext").select(); toast("Select all and copy"); });

/* ---------- handover (written on the device from the record, no AI service) ---------- */
function admDay(p) {
  if (!p.admitted) return 0;
  const [y, mo, d] = p.admitted.split("-").map(Number), now = new Date();
  return Math.max(1, Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(y, mo - 1, d)) / 864e5) + 1);
}
const initials = name => (name || "").split(/[\s,]+/).filter(Boolean).map(w => w[0].toUpperCase()).join("");
function handover(p, opts = {}) {
  const sentence = s => { s = (s || "").trim().replace(/\s+/g, " "); if (!s) return ""; s = s[0].toUpperCase() + s.slice(1); return /[.!?]$/.test(s) ? s : s + "."; };
  const lowerFirst = s => { s = (s || "").trim().replace(/[.\s]+$/, ""); return s && !/^[A-Z]{2}/.test(s) ? s[0].toLowerCase() + s.slice(1) : s; };
  const yrs = parseInt(ageOf(p), 10);
  const who = [isNaN(yrs) ? "" : yrs + "y", { M: "male", F: "female" }[p.sex] || ""].filter(Boolean).join(" ");
  const head = [who, (p.name || "").trim(), admDay(p) ? "day " + admDay(p) + " of admission" : ""].filter(Boolean).join(" - ");
  const parts = [];
  if (head) parts.push(head + ".");
  parts.push(sentence(`${p.comorbid ? "Known with " + lowerFirst(p.comorbid) : "No comorbids"}${p.diagnosis ? ", with " + lowerFirst(p.diagnosis) : ""}`));
  if (p.ward && opts.ward !== false) parts.push(sentence(`${wardGroup(p) === "in" ? "Inpatient in ward" : "Outlier in ward"} ${p.ward}`));
  const meds = patientMeds(p).filter(m => medCat(m.name) === "essential").map(medText).join("; ");
  if (meds || p.treatment) parts.push(sentence(`Currently on ${[meds, lowerFirst(p.treatment)].filter(Boolean).join("; ")}`.replace(/^Currently on ;?\s*/, "Currently on ")));
  const ct = p.ct.filter(c => c.conclusion).at(-1);
  if (ct) parts.push(sentence(`${ct.title && ct.title !== "CT" ? ct.title : "CT"}${ct.date ? " (" + fmtDate(ct.date) + ")" : ""}: ${lowerFirst(ct.conclusion.replace(/\n+/g, " "))}`));
  const lab = (p.labs || []).filter(l => l.notes).at(-1);
  if (lab) parts.push(sentence(`Labs${lab.date ? " (" + fmtDate(lab.date) + ")" : ""}: ${lab.notes.replace(/\s*\n+\s*/g, ". ")}`));
  if (p.plan) parts.push(sentence(`Current plan: ${lowerFirst(p.plan)}`));
  if (p.dispo) parts.push(sentence(`${DISPO[p.dispo]}${p.dispoNote ? ": " + lowerFirst(p.dispoNote) : ""}`));
  return parts.join(" ");
}

/* ---------- summary view ---------- */
function summaryText(p) {
  const L = [];
  L.push(`${p.name || "Unnamed"}  ${[ageOf(p), p.sex].filter(Boolean).join(" ")}`);
  L.push(`PMI ${p.mrn || "-"}${p.ward ? "  " + p.ward : ""}${p.admitted ? "  Admitted " + fmtDate(p.admitted) + " (day " + admDay(p) + " of admission)" : ""}`);
  L.push("", "DIAGNOSIS", p.diagnosis || "-", "Comorbidities: " + (p.comorbid || "none"), "", "TREATMENT", p.treatment || "-");
  if (patientMeds(p).length) L.push(...p.meds.map(m => "- " + medText(m)));
  if (p.plan) L.push("", "PLAN", p.plan);
  L.push("", "CT");
  if (p.ct.length) p.ct.forEach(c => L.push(`${fmtDate(c.date)} ${c.title || "CT"}: ${c.conclusion || "-"}`)); else L.push("-");
  if ((p.labs || []).length) { L.push("", "LABS"); p.labs.forEach(l => L.push(`${fmtDate(l.date)} ${l.title || "Labs"}${l.notes ? ": " + l.notes : ""}`)); }
  if (p.dispo) L.push("", "DISPOSITION", DISPO[p.dispo] + (p.dispoNote ? ": " + p.dispoNote : "") + (p.dispoDate ? " (" + fmtDate(p.dispoDate) + ")" : ""));
  return L.join("\n");
}

    <div class="sec-h"><h2>Handover</h2><span class="hint">Edit before sending if needed</span></div>
    <textarea id="hotext" aria-label="Handover text"></textarea>
    <div class="row"><button class="primary" id="hocopy">${icon("copy")}Copy handover</button><button class="ghost" id="hoclose">Close</button></div>
  </div>
  <textarea id="copybox" class="mono" rows="10" style="margin-top:12px;font-size:13px" hidden aria-label="Summary text">${esc(summaryText(p))}</textarea>`;
  if ($("#reactivate")) $("#reactivate").onclick = async () => {
    p.history = [...(p.history || []), { dispo: p.dispo, note: p.dispoNote, date: p.dispoDate, ward: p.ward, admitted: p.admitted, diagnosis: p.diagnosis }];
    p.dispo = ""; p.dispoNote = ""; p.dispoDate = ""; p.admitted = new Date().toISOString().slice(0,10);
    await save(p); toast("Back on the active list. Update the ward and admission details."); go("edit-" + p.id);
  };
  $("#app").querySelectorAll("[data-lab]").forEach(b => b.onclick = () => openViewer(p.labs[+b.dataset.lab].pages, +b.dataset.pg));
  $("#hobtn").onclick = () => { $("#hotext").value = handover(p); $("#ho").hidden = false; $("#ho").scrollIntoView({behavior: "smooth", block: "start"}); };
  $("#hoclose").onclick = () => { $("#ho").hidden = true; };
  $("#hocopy").onclick = () => {
    const txt = $("#hotext").value;
    navigator.clipboard.writeText(txt).then(() => toast("Handover copied"), () => { $("#hotext").focus(); $("#hotext").select(); toast("Select all and copy"); });
  };
  $("#copy").onclick = () => {
    const txt = summaryText(p);
    navigator.clipboard.writeText(txt).then(() => toast("Summary copied"), () => {
      const b = $("#copybox"); b.hidden = false; b.focus(); b.select(); toast("Select all and copy");
    });
  };
}

/* ---------- boot ---------- */
window.__wpl = { parseSticker, findConclusion };
load().then(() => { route(); backupPrompt(); });
function backupPrompt() {
  // Weekly: the first time the app is opened on a Friday (or any day if the last backup is over a week old).
  const now = new Date(), today = now.toDateString(), b = backupState();
  const friday = new Date(now); friday.setHours(0, 0, 0, 0); friday.setDate(friday.getDate() - ((friday.getDay() - 5 + 7) % 7));
  const due = !b.last || new Date(b.last) < friday;
  const overdue = !b.last || (now - new Date(b.last)) > 7 * 864e5;
  if (!b.real || !b.changed || !due || !(now.getDay() === 5 || overdue) || lsGet("wpl-prompted") === today) return;
  lsSet("wpl-prompted", today);
  const m = document.createElement("div"); m.className = "bkmodal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-label", "Weekly backup");
  m.innerHTML = `<div class="bkcard"><h2 style="color:var(--fg);font-size:18px;letter-spacing:0;text-transform:none">Weekly backup</h2>
    <div class="row"><button class="primary" id="bkm-yes">${icon("save")}Backup now</button><button class="ghost" id="bkm-no">Later</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#bkm-no").onclick = () => m.remove();
  m.querySelector("#bkm-yes").onclick = async () => { m.remove(); await exportBackup(); };
  m.querySelector("#bkm-yes").focus();
}
</script>
<script>
// Offline + updates: a new version downloads in the background when the app opens online,
// then the page reloads once to show it. Records are untouched.
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloading) { reloading = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(e => console.warn("offline cache not available", e)));
}
</script>
